<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="token-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#292212" />
      <stop offset="60%" stop-color="#141008" />
      <stop offset="100%" stop-color="#080603" />
    </radialGradient>
    <linearGradient id="holy-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#facc15" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a16207" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="iron-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a16207" />
      <stop offset="50%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shadow-body" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#241f17" />
      <stop offset="100%" stop-color="#0a0805" />
    </linearGradient>
  </defs>

  <!-- Outer Token Bevel -->
  <circle cx="60" cy="60" r="58" fill="#080603" />
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#iron-border)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="53" fill="url(#token-bg)" stroke="#713f12" stroke-width="1" />

  <!-- Background Halo / Sacred Rays Heraldry -->
  <g opacity="0.12" stroke="#facc15" stroke-width="1.2" fill="none">
    <circle cx="60" cy="46" r="30" />
    <circle cx="60" cy="46" r="38" stroke-dasharray="2,4" />
    <line x1="60" y1="6" x2="60" y2="86" />
    <line x1="20" y1="46" x2="100" y2="46" />
  </g>

  <!-- Priest Robes & Sacred Stole -->
  <path d="M 22 108 C 24 82 40 70 54 68 L 52 86 L 40 108 Z" fill="url(#shadow-body)" />
  <path d="M 98 108 C 96 82 80 70 66 68 L 68 86 L 80 108 Z" fill="url(#shadow-body)" />
  <path d="M 26 108 C 28 80 44 68 60 68 C 76 68 92 80 94 108 Z" fill="url(#shadow-body)" stroke="#0a0805" stroke-width="2" />

  <!-- Sacred Prayer Stole Ribbons Hanging Down -->
  <path d="M 48 70 L 46 108 L 54 108 L 54 74 Z" fill="#3b2b18" stroke="url(#holy-light)" stroke-width="0.8" />
  <path d="M 72 70 L 74 108 L 66 108 L 66 74 Z" fill="#3b2b18" stroke="url(#holy-light)" stroke-width="0.8" />
  <!-- Embroidered Stole Symbols -->
  <path d="M 48 84 L 52 84 M 50 82 L 50 86" stroke="#facc15" stroke-width="1" />
  <path d="M 48 98 L 52 98 M 50 96 L 50 100" stroke="#facc15" stroke-width="1" />
  <path d="M 68 84 L 72 84 M 70 82 L 70 86" stroke="#facc15" stroke-width="1" />
  <path d="M 68 98 L 72 98 M 70 96 L 70 100" stroke="#facc15" stroke-width="1" />

  <!-- Monastic Hood / Cowl -->
  <path d="M 60 18 C 44 18 38 32 38 48 C 38 64 46 72 60 72 C 74 72 82 64 82 48 C 82 32 76 18 60 18 Z" fill="url(#shadow-body)" />
  <!-- Hood Peak and Edge Highlights -->
  <path d="M 60 16 C 62 16 80 28 81 48 C 81 58 76 68 70 71" fill="none" stroke="url(#holy-light)" stroke-width="2" stroke-linecap="round" />
  <path d="M 60 16 C 58 16 42 26 40 44" fill="none" stroke="url(#holy-light)" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />

  <!-- Face Cavity in Deep Sacred Shadow -->
  <ellipse cx="60" cy="48" rx="12" ry="16" fill="#080603" />

  <!-- Raised Holy Amulet / Reliquary at center chest -->
  <circle cx="60" cy="74" r="5" fill="#ca8a04" stroke="url(#holy-light)" stroke-width="1.2" />
  <circle cx="60" cy="74" r="2" fill="#fef08a" />
  <line x1="60" y1="64" x2="60" y2="84" stroke="url(#holy-light)" stroke-width="1.5" />
  <line x1="53" y1="71" x2="67" y2="71" stroke="url(#holy-light)" stroke-width="1.5" />
</svg>
