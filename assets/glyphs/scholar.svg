<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="token-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#142133" />
      <stop offset="60%" stop-color="#0c1421" />
      <stop offset="100%" stop-color="#05080f" />
    </radialGradient>
    <linearGradient id="arcane-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="iron-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shadow-body" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1b2536" />
      <stop offset="100%" stop-color="#070b12" />
    </linearGradient>
  </defs>

  <!-- Outer Token Bevel -->
  <circle cx="60" cy="60" r="58" fill="#05080f" />
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#iron-border)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="53" fill="url(#token-bg)" stroke="#0369a1" stroke-width="1" />

  <!-- Background Arcane Geometry / Astrolabe Watermark -->
  <g opacity="0.09" stroke="#38bdf8" stroke-width="1.2" fill="none">
    <circle cx="60" cy="60" r="42" />
    <polygon points="60,22 93,78 27,78" />
    <polygon points="60,98 27,42 93,42" />
  </g>

  <!-- Scholar Bust: Robes & Satchel -->
  <!-- Shoulders & Academic Cloak -->
  <path d="M 22 108 C 24 82 40 70 54 68 L 52 86 L 40 108 Z" fill="url(#shadow-body)" />
  <path d="M 98 108 C 96 82 80 70 66 68 L 68 86 L 80 108 Z" fill="url(#shadow-body)" />
  <path d="M 26 108 C 28 80 44 68 60 68 C 76 68 92 80 94 108 Z" fill="url(#shadow-body)" stroke="#070b12" stroke-width="2" />

  <!-- Leather Satchel Strap Across Chest -->
  <path d="M 32 78 L 84 108" stroke="#334155" stroke-width="5" stroke-linecap="round" />
  <path d="M 32 78 L 84 108" stroke="url(#arcane-light)" stroke-width="1" />

  <!-- Head & Academic Cowl -->
  <path d="M 60 20 C 44 20 40 34 40 48 C 40 62 48 68 60 68 C 72 68 80 62 80 48 C 80 34 76 20 60 20 Z" fill="url(#shadow-body)" />
  <path d="M 60 18 C 62 18 79 28 80 46 C 80 56 75 64 70 67" fill="none" stroke="url(#arcane-light)" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 60 18 C 58 18 42 26 41 42" fill="none" stroke="url(#arcane-light)" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />

  <!-- Scribe's Long Feather Quill Tucked Over Ear -->
  <path d="M 76 38 C 84 26 94 16 98 12 C 94 20 90 32 82 40 Z" fill="#0284c7" stroke="url(#arcane-light)" stroke-width="0.8" />
  <line x1="76" y1="40" x2="96" y2="14" stroke="#e0f2fe" stroke-width="0.8" />

  <!-- Shadow Face with Round Spectacles Glow -->
  <ellipse cx="60" cy="46" rx="11" ry="14" fill="#070b12" />
  <circle cx="55" cy="46" r="3.2" fill="none" stroke="url(#arcane-light)" stroke-width="1.2" />
  <circle cx="65" cy="46" r="3.2" fill="none" stroke="url(#arcane-light)" stroke-width="1.2" />
  <line x1="58" y1="46" x2="62" y2="46" stroke="url(#arcane-light)" stroke-width="1.2" />

  <!-- Ancient Tome / Grimoire in Arm on Flank -->
  <g transform="translate(24, 82)">
    <polygon points="6,6 26,2 28,24 8,28" fill="#1e293b" stroke="url(#arcane-light)" stroke-width="1" />
    <path d="M 8 28 C 16 26 24 26 28 24" fill="none" stroke="#64748b" stroke-width="2" />
    <line x1="16" y1="4" x2="18" y2="26" stroke="#0284c7" stroke-width="1" />
  </g>
</svg>
