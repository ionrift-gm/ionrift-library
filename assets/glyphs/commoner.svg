<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="token-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#162215" />
      <stop offset="60%" stop-color="#0c140c" />
      <stop offset="100%" stop-color="#050804" />
    </radialGradient>
    <linearGradient id="harvest-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#84cc16" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#365314" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="iron-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65a30d" />
      <stop offset="50%" stop-color="#365314" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shadow-body" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a2618" />
      <stop offset="100%" stop-color="#060a05" />
    </linearGradient>
  </defs>

  <!-- Outer Token Bevel -->
  <circle cx="60" cy="60" r="58" fill="#050804" />
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#iron-border)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="53" fill="url(#token-bg)" stroke="#1e293b" stroke-width="1" />

  <!-- Background Grain Sheaf Heraldry Watermark -->
  <g opacity="0.08" stroke="#a3e635" stroke-width="1.2" fill="none">
    <circle cx="60" cy="60" r="42" />
    <line x1="60" y1="24" x2="60" y2="82" />
    <ellipse cx="54" cy="34" rx="4" ry="7" transform="rotate(-30 54 34)" />
    <ellipse cx="66" cy="34" rx="4" ry="7" transform="rotate(30 66 34)" />
    <ellipse cx="52" cy="46" rx="4" ry="7" transform="rotate(-35 52 46)" />
    <ellipse cx="68" cy="46" rx="4" ry="7" transform="rotate(35 68 46)" />
    <ellipse cx="60" cy="24" rx="3.5" ry="6" />
  </g>

  <!-- Harvest Sickle hooked over shoulder on right flank -->
  <g stroke="#060a05" stroke-width="1.2">
    <!-- Curved Sickle Blade -->
    <path d="M 94 48 C 96 36 88 24 76 22 C 68 20 62 26 62 30 C 66 26 74 26 82 32 C 88 38 88 46 84 54 Z" fill="#475569" stroke="url(#harvest-rim)" stroke-width="1" />
    <!-- Wooden Handle -->
    <line x1="92" y1="52" x2="98" y2="74" stroke="#713f12" stroke-width="4" stroke-linecap="round" />
    <line x1="92" y1="52" x2="98" y2="74" stroke="url(#harvest-rim)" stroke-width="1" opacity="0.6" stroke-linecap="round" />
  </g>

  <!-- Commoner / Peasant Laborer Bust -->
  <!-- Shoulders & Coarse Linen Tunic -->
  <path d="M 22 108 C 24 82 40 70 54 68 L 52 86 L 40 108 Z" fill="url(#shadow-body)" />
  <path d="M 98 108 C 96 82 80 70 66 68 L 68 86 L 80 108 Z" fill="url(#shadow-body)" />
  <path d="M 26 108 C 28 82 44 68 60 68 C 76 68 92 82 94 108 Z" fill="url(#shadow-body)" stroke="#060a05" stroke-width="2" />

  <!-- Draped Cowl Collar / Coarse Work Tunic V-Neck -->
  <path d="M 44 70 C 50 80 70 80 76 70 L 72 84 C 64 88 56 88 48 84 Z" fill="#2d3725" stroke="#060a05" stroke-width="1.5" />
  <!-- Laced Cord V-Neck -->
  <path d="M 54 72 L 60 84 L 66 72" fill="none" stroke="#65a30d" stroke-width="1.2" />
  <line x1="56" y1="76" x2="64" y2="76" stroke="#ca8a04" stroke-width="1" />
  <line x1="57" y1="80" x2="63" y2="80" stroke="#ca8a04" stroke-width="1" />

  <!-- Peasant Cap / Coif and Head Profile -->
  <path d="M 60 22 C 46 22 40 34 40 48 C 40 60 48 68 60 68 C 72 68 80 60 80 48 C 80 34 74 22 60 22 Z" fill="url(#shadow-body)" />

  <!-- Linen Peasant Cap / Coif Brim -->
  <path d="M 40 40 C 44 26 56 24 68 24 C 76 24 80 30 80 42 C 76 40 68 38 60 38 C 50 38 42 40 40 40 Z" fill="#36412d" stroke="#060a05" stroke-width="1.2" />
  <!-- Chin Strap -->
  <path d="M 43 42 C 43 54 48 64 54 66" fill="none" stroke="#4d7c0f" stroke-width="1.5" opacity="0.8" />

  <!-- Harvest Rim Highlights along Cap & Shoulders -->
  <path d="M 60 22 C 72 22 79 30 80 46 C 80 58 75 66 68 68" fill="none" stroke="url(#harvest-rim)" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 42 70 C 32 76 26 86 24 98" fill="none" stroke="url(#harvest-rim)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Weathered Face in Shadow -->
  <ellipse cx="60" cy="48" rx="12" ry="14" fill="#060a05" />
  <!-- Humble honest brow / profile -->
  <path d="M 52 56 C 56 62 64 62 68 56" fill="none" stroke="url(#harvest-rim)" stroke-width="1" opacity="0.5" />

  <!-- Stalk of Wheat over Left Shoulder -->
  <g transform="translate(24, 52) rotate(-20)">
    <line x1="12" y1="40" x2="12" y2="8" stroke="#ca8a04" stroke-width="1.5" />
    <ellipse cx="9" cy="18" rx="2" ry="4" transform="rotate(-30 9 18)" fill="#eab308" />
    <ellipse cx="15" cy="18" rx="2" ry="4" transform="rotate(30 15 18)" fill="#eab308" />
    <ellipse cx="9" cy="26" rx="2" ry="4" transform="rotate(-30 9 26)" fill="#eab308" />
    <ellipse cx="15" cy="26" rx="2" ry="4" transform="rotate(30 15 26)" fill="#eab308" />
    <ellipse cx="12" cy="10" rx="2" ry="4" fill="#facc15" />
  </g>

  <!-- Inner Inset Frame Ring -->
  <circle cx="60" cy="60" r="54.5" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.6" />
</svg>
