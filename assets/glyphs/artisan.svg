<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="token-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a170d" />
      <stop offset="60%" stop-color="#160c06" />
      <stop offset="100%" stop-color="#080402" />
    </radialGradient>
    <linearGradient id="forge-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#fb923c" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="iron-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="50%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shadow-body" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2c1a11" />
      <stop offset="100%" stop-color="#0c0704" />
    </linearGradient>
  </defs>

  <!-- Outer Token Bevel -->
  <circle cx="60" cy="60" r="58" fill="#080402" />
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#iron-border)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="53" fill="url(#token-bg)" stroke="#431407" stroke-width="1" />

  <!-- Background Forge Anvil & Hammer Heraldry -->
  <g opacity="0.08" stroke="#fb923c" stroke-width="1.2" fill="none">
    <circle cx="60" cy="60" r="42" />
    <path d="M 38 68 L 82 68 L 76 76 L 44 76 Z" />
    <path d="M 32 68 L 88 68 C 86 62 80 60 74 60 L 46 60 C 40 60 34 62 32 68 Z" />
    <line x1="60" y1="26" x2="60" y2="52" />
  </g>

  <!-- Smithing Sledgehammer resting over shoulder -->
  <g stroke="#0c0704" stroke-width="1.5">
    <!-- Ash wood haft -->
    <line x1="22" y1="108" x2="38" y2="28" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
    <line x1="22" y1="108" x2="38" y2="28" stroke="url(#forge-rim)" stroke-width="1" opacity="0.6" stroke-linecap="round" />
    <!-- Hammer Head (Forged Iron Block) -->
    <g transform="rotate(-25 38 28)">
      <rect x="26" y="21" width="24" height="14" rx="2" fill="#334155" stroke="#0c0704" stroke-width="1.5" />
      <!-- Beveled Face -->
      <polygon points="26,21 23,24 23,32 26,35" fill="#475569" />
      <polygon points="50,21 53,24 53,32 50,35" fill="#475569" />
      <line x1="24" y1="28" x2="52" y2="28" stroke="url(#forge-rim)" stroke-width="1.2" />
    </g>
  </g>

  <!-- Artisan / Smith Bust: Broad Shoulders & Leather Apron -->
  <!-- Back Shoulders / Tunic -->
  <path d="M 20 108 C 22 80 38 68 52 66 L 50 86 L 38 108 Z" fill="url(#shadow-body)" />
  <path d="M 100 108 C 98 80 82 68 68 66 L 70 86 L 82 108 Z" fill="url(#shadow-body)" />
  <path d="M 24 108 C 26 80 44 66 60 66 C 76 66 94 80 96 108 Z" fill="url(#shadow-body)" stroke="#0c0704" stroke-width="2" />

  <!-- Heavy Leather Apron & Harness Straps -->
  <path d="M 42 70 L 60 88 L 78 70 L 80 108 L 40 108 Z" fill="#3d2114" stroke="#0c0704" stroke-width="1.5" />
  <!-- Crossed Leather Braces -->
  <line x1="42" y1="70" x2="68" y2="106" stroke="#522a18" stroke-width="3" />
  <line x1="78" y1="70" x2="52" y2="106" stroke="#522a18" stroke-width="3" />
  <!-- Brass Buckles / Rivets -->
  <circle cx="48" cy="78" r="2.5" fill="#ea580c" stroke="#431407" stroke-width="1" />
  <circle cx="72" cy="78" r="2.5" fill="#ea580c" stroke="#431407" stroke-width="1" />
  <circle cx="60" cy="94" r="2.5" fill="#ea580c" stroke="#431407" stroke-width="1" />

  <!-- Head / Leather Cowl & Headband -->
  <path d="M 60 22 C 46 22 42 34 42 46 C 42 58 48 66 60 66 C 72 66 78 58 78 46 C 78 34 74 22 60 22 Z" fill="url(#shadow-body)" />

  <!-- Artisan Headband / Bandana knot -->
  <path d="M 43 36 C 52 32 68 32 77 36 L 78 42 C 68 38 52 38 42 42 Z" fill="#7c2d12" stroke="#0c0704" stroke-width="1" />
  <path d="M 42 38 C 38 40 34 44 32 50" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 42 40 C 38 44 36 50 35 56" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round" />

  <!-- Forge-Glow Highlights on Head and Shoulder -->
  <path d="M 60 22 C 70 22 77 30 78 44 C 78 56 74 64 68 66" fill="none" stroke="url(#forge-rim)" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 76 68 C 86 72 94 82 95 98" fill="none" stroke="url(#forge-rim)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Rugged Face / Shaded Beard -->
  <path d="M 50 44 C 50 58 54 64 60 64 C 66 64 70 58 70 44 Z" fill="#0c0704" />
  <path d="M 52 52 C 56 62 64 62 68 52" fill="none" stroke="url(#forge-rim)" stroke-width="1.2" opacity="0.75" />

  <!-- Smithing Tongs Silhouette on Right Flank -->
  <g transform="translate(86, 72) rotate(15)">
    <line x1="4" y1="0" x2="4" y2="34" stroke="#475569" stroke-width="2" />
    <line x1="8" y1="0" x2="8" y2="34" stroke="#475569" stroke-width="2" />
    <circle cx="6" cy="10" r="2" fill="#94a3b8" />
  </g>

  <!-- Inner Frame Accent -->
  <circle cx="60" cy="60" r="54.5" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.6" />
</svg>
