<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="token-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e2638" />
      <stop offset="60%" stop-color="#111622" />
      <stop offset="100%" stop-color="#080a0f" />
    </radialGradient>
    <linearGradient id="rim-light" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="iron-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shadow-body" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1c2434" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>
  </defs>

  <!-- Outer Token Bevel -->
  <circle cx="60" cy="60" r="58" fill="#080a0f" />
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#iron-border)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="53" fill="url(#token-bg)" stroke="#1e293b" stroke-width="1" />

  <!-- Subtle Medieval Compass / Star Watermark -->
  <g opacity="0.08" stroke="#cbd5e1" stroke-width="1" fill="none">
    <circle cx="60" cy="60" r="42" />
    <line x1="60" y1="18" x2="60" y2="102" />
    <line x1="18" y1="60" x2="102" y2="60" />
    <polygon points="60,25 64,56 95,60 64,64 60,95 56,64 25,60 56,56" />
  </g>

  <!-- Character Silhouette: Rustic Hooded Citizen Bust -->
  <!-- Shoulders & Cloak -->
  <path d="M 22 108 C 24 84 38 72 48 68 C 44 72 42 78 42 84 L 40 108 Z" fill="url(#shadow-body)" />
  <path d="M 98 108 C 96 84 82 72 72 68 C 76 72 78 78 78 84 L 80 108 Z" fill="url(#shadow-body)" />
  <path d="M 28 108 C 30 82 46 68 60 68 C 74 68 90 82 92 108 Z" fill="url(#shadow-body)" stroke="#090c12" stroke-width="2" />
  
  <!-- Cloak Collar / Cowl Folds -->
  <path d="M 44 70 C 48 82 56 86 60 86 C 64 86 72 82 76 70 C 72 74 66 76 60 76 C 54 76 48 74 44 70 Z" fill="#242f44" opacity="0.8" />
  <path d="M 52 74 L 60 84 L 68 74" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Head / Hood Profile -->
  <path d="M 60 22 C 45 22 40 36 40 48 C 40 60 48 68 60 68 C 72 68 80 60 80 48 C 80 36 75 22 60 22 Z" fill="url(#shadow-body)" />
  
  <!-- Hood Peak & Rim Light Highlights -->
  <path d="M 60 20 C 62 20 78 30 79 48 C 79 58 74 66 68 69" fill="none" stroke="url(#rim-light)" stroke-width="2" stroke-linecap="round" />
  <path d="M 60 20 C 58 20 44 28 42 42" fill="none" stroke="url(#rim-light)" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />
  <path d="M 60 20 L 60 24" stroke="url(#rim-light)" stroke-width="2" stroke-linecap="round" />

  <!-- Shadow Face Interior -->
  <ellipse cx="60" cy="46" rx="11" ry="14" fill="#090c12" opacity="0.95" />
  <!-- Subtle eye gleam in darkness -->
  <circle cx="56" cy="45" r="1" fill="#94a3b8" opacity="0.6" />
  <circle cx="64" cy="45" r="1" fill="#94a3b8" opacity="0.6" />

  <!-- Inner Inset Frame Ring -->
  <circle cx="60" cy="60" r="54.5" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.6" />
</svg>
