<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="token-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a122e" />
      <stop offset="60%" stop-color="#160818" />
      <stop offset="100%" stop-color="#0a020b" />
    </radialGradient>
    <linearGradient id="rose-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="iron-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="50%" stop-color="#701a75" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shadow-body" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2b112d" />
      <stop offset="100%" stop-color="#0a030c" />
    </linearGradient>
  </defs>

  <!-- Outer Token Bevel -->
  <circle cx="60" cy="60" r="58" fill="#0a020b" />
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#iron-border)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="53" fill="url(#token-bg)" stroke="#701a75" stroke-width="1" />

  <!-- Background Lyre & Mask Heraldry Watermark -->
  <g opacity="0.08" stroke="#ec4899" stroke-width="1.2" fill="none">
    <circle cx="60" cy="60" r="42" />
    <!-- Lyre outline -->
    <path d="M 44 40 C 42 64 50 78 60 78 C 70 78 78 64 76 40" />
    <line x1="52" y1="40" x2="52" y2="76" />
    <line x1="60" y1="40" x2="60" y2="78" />
    <line x1="68" y1="40" x2="68" y2="76" />
    <line x1="40" y1="40" x2="80" y2="40" />
  </g>

  <!-- Lute Neck slung over shoulder on left -->
  <g stroke="#0a030c" stroke-width="1.2" transform="rotate(-15 32 44)">
    <!-- Neck -->
    <rect x="28" y="16" width="6" height="54" fill="#581c87" />
    <!-- Strings -->
    <line x1="29.5" y1="16" x2="29.5" y2="70" stroke="url(#rose-rim)" stroke-width="0.8" />
    <line x1="32.5" y1="16" x2="32.5" y2="70" stroke="url(#rose-rim)" stroke-width="0.8" />
    <!-- Frets -->
    <line x1="28" y1="26" x2="34" y2="26" stroke="#c084fc" stroke-width="0.8" />
    <line x1="28" y1="36" x2="34" y2="36" stroke="#c084fc" stroke-width="0.8" />
    <line x1="28" y1="46" x2="34" y2="46" stroke="#c084fc" stroke-width="0.8" />
    <!-- Pegbox & Tuning Pegs -->
    <path d="M 28 16 L 24 6 L 30 6 L 34 16 Z" fill="#3b0764" />
    <circle cx="23" cy="8" r="1.5" fill="#e9d5ff" />
    <circle cx="23" cy="12" r="1.5" fill="#e9d5ff" />
    <circle cx="33" cy="8" r="1.5" fill="#e9d5ff" />
    <circle cx="33" cy="12" r="1.5" fill="#e9d5ff" />
  </g>

  <!-- Performer / Bard Bust -->
  <!-- Shoulders & Cloaklet / Doublet -->
  <path d="M 22 108 C 24 82 40 70 54 68 L 52 86 L 40 108 Z" fill="url(#shadow-body)" />
  <path d="M 98 108 C 96 82 80 70 66 68 L 68 86 L 80 108 Z" fill="url(#shadow-body)" />
  <path d="M 26 108 C 28 80 44 66 60 66 C 76 66 92 80 94 108 Z" fill="url(#shadow-body)" stroke="#0a030c" stroke-width="2" />

  <!-- Dashing Asymmetrical Capelet & Ruffled Collar -->
  <path d="M 44 68 C 48 76 72 76 76 68 L 74 84 C 64 88 56 88 46 84 Z" fill="#4a154b" stroke="#0a030c" stroke-width="1.5" />
  <!-- Ruffled Cravat -->
  <path d="M 54 72 C 54 78 58 84 60 86 C 62 84 66 78 66 72 Z" fill="#fbcfe8" opacity="0.85" />
  <!-- Gem Brooch Clasp -->
  <circle cx="60" cy="72" r="3" fill="#db2777" stroke="url(#rose-rim)" stroke-width="1" />

  <!-- Head Silhouette -->
  <circle cx="60" cy="46" r="15" fill="url(#shadow-body)" />

  <!-- Theatrical Mask (Venetian / Harlequin Half-Mask) -->
  <path d="M 47 40 C 53 38 67 38 73 40 C 75 48 72 56 60 58 C 48 56 45 48 47 40 Z" fill="#1b081e" stroke="url(#rose-rim)" stroke-width="1.2" />
  <!-- Slanted Eye Slits -->
  <ellipse cx="53" cy="46" rx="3.5" ry="1.8" transform="rotate(-15 53 46)" fill="#ec4899" opacity="0.8" />
  <ellipse cx="67" cy="46" rx="3.5" ry="1.8" transform="rotate(15 67 46)" fill="#ec4899" opacity="0.8" />
  <circle cx="53" cy="46" r="0.8" fill="#ffffff" />
  <circle cx="67" cy="46" r="0.8" fill="#ffffff" />

  <!-- Flamboyant Jaunty Hat with Ostrich Feather Plume -->
  <!-- Hat Crown & Upturned Brim -->
  <path d="M 34 38 C 34 26 44 22 62 20 C 78 18 88 24 88 34 C 84 38 72 38 60 38 C 44 38 36 38 34 38 Z" fill="#3b0c3f" stroke="#0a030c" stroke-width="1.5" />
  <!-- Upturned Brim Curve -->
  <path d="M 32 38 C 44 32 76 30 90 34 C 88 40 76 42 60 42 C 44 42 34 40 32 38 Z" fill="#581c87" stroke="url(#rose-rim)" stroke-width="1.2" />

  <!-- Sweeping Feather Plume arching back -->
  <path d="M 74 24 C 86 10 98 8 102 6 C 100 16 94 26 82 32 Z" fill="#ec4899" stroke="url(#rose-rim)" stroke-width="1" />
  <path d="M 76 24 C 86 14 96 12 100 8" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.9" />

  <!-- Rose-Glow Highlights on Shoulder and Collar -->
  <path d="M 78 68 C 88 74 94 84 96 98" fill="none" stroke="url(#rose-rim)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 42 70 C 32 76 26 86 24 98" fill="none" stroke="url(#rose-rim)" stroke-width="1" opacity="0.6" stroke-linecap="round" />

  <!-- Inner Inset Frame Ring -->
  <circle cx="60" cy="60" r="54.5" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.6" />
</svg>
